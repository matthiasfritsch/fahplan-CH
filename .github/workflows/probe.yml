name: probe
on:
  push:
    branches: ["claude/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="Mozilla/5.0 (Fahrplan-Board; Familienkalender)"
          curl -sSL -m 30 -A "$U" -o p.html https://www.mybasel.ch/veranstaltungen/kinder
          python3 - <<'PY'
          import re
          s=open("p.html",encoding="utf-8").read()
          s=re.sub(r"(?s)<(script|style)[^>]*>.*?</\1>","",s)
          i=s.find("Veranstaltungen f")
          j=s.find("Veranstaltung", s.find("Ab heute"))
          print("=== RAW"); print(re.sub(r"\s+"," ",s[j:j+6000]))
          t=re.sub(r"<[^>]+>","\n",s[j:]); lines=[l.strip() for l in t.split("\n") if l.strip()]
          print("=== LINES"); print("\n".join(lines[:150]))
          PY
