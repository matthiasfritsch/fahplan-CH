name: probe
on:
  push:
    branches: ["claude/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -m 30 -A "Mozilla/5.0 fahrplan-board" -o p.html https://gugubasel.ch/
          curl -sSI -m 20 https://gugubasel.ch/ | grep -iE 'last-modified|etag|cache-control|content-length'
          python3 - <<'PY'
          import re
          s=open("p.html",encoding="utf-8").read()
          s=re.sub(r"(?s)<(script|style)[^>]*>.*?</\1>","",s)
          s=re.sub(r'style="[^"]*"','style=""',s)
          s=re.sub(r'(src|srcset)="data:[^"]*"',r'\1="DATA"',s)
          s=re.sub(r"<svg.*?</svg>","<svg/>",s,flags=re.S)
          s=re.sub(r"\s+"," ",s)
          i=s.find('id="sat-panel"'); print("=== SAT"); print(s[i:i+5000])
          i=s.find("FLOHMI"); print("=== FLOHMI"); print(s[i-300:i+2500])
          i=s.find('id="sun-panel"'); print("=== SUN"); print(s[i:i+1500])
          print("=== classes"); print(sorted(set(re.findall(r'class="([^"]+)"',s[s.find('id="sat-panel"'):s.find('id="guides-panel"')])))[:80])
          PY
